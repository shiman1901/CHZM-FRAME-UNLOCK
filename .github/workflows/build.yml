name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build CHZMFRAMEUNLOCK1.csproj -c Release

      - name: Publish portable executable
        run: dotnet publish CHZMFRAMEUNLOCK1.csproj -c Release -o out

      - uses: actions/upload-artifact@v4
        with:
          name: CHZMFRAMEUNLOCK1-exe
          path: out/CHZMFRAMEUNLOCK1.exe
